    ondragover="onDragOver(event)"
    ondragleave="onDragLeave(event)"
    ondrop="onDrop(event)"
    onclick="document.getElementById('fileInput').click()"

</div>

<script>
// ─── ツールロジック ───────────────────────────────────────────

let bodyText = null;

// 起動時にデータ情報を表示
function initInfo() {
  const keys = Object.keys(AUDIO_STORE);
  document.getElementById('infoCount').textContent = keys.length + ' 変数';
  const totalChars = Object.values(AUDIO_STORE).reduce((s,v) => s + v.length, 0);
  document.getElementById('infoSize').textContent = Math.round(totalChars / 1024) + ' KB';
  const tags = document.getElementById('infoTags');
  keys.forEach(k => {
    const t = document.createElement('span');
    t.className = 'tag'; t.textContent = k;
    tags.appendChild(t);
  });
}

function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls||''}">${msg}</div>`;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

function onDragOver(e) { e.preventDefault(); document.getElementById('dropZone').classList.add('over'); }
function onDragLeave(e) { document.getElementById('dropZone').classList.remove('over'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
}
function onFileSelect(e) {
  const file = e.target.files[0];
  if (file) loadFile(file);
}

function loadFile(file) {
  clearLog();
  if (!file.name.endsWith('.html')) {
    log('❌ .html ファイルを選択してください', 'err'); return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    bodyText = ev.target.result;
    // プレースホルダーチェック
    const found = [];
    const keys = Object.keys(AUDIO_STORE);
    keys.forEach(k => {
      if (bodyText.includes(`/* @@AUDIO_PLACEHOLDER:${k}@@ */`)) found.push(k);
    });
    if (found.length === 0) {
      log('⚠️ このファイルにはプレースホルダーが見当たりません。<br>本体ファイルか確認してください。', 'warn');
      document.getElementById('mergeBtn').disabled = true;
      document.getElementById('dropZone').classList.remove('ready');
    } else {
      log(`✅ <strong>${file.name}</strong> を読み込みました`, 'ok');
      log(`プレースホルダー検出: ${found.map(k=>`<span class="tag">${k}</span>`).join('')}`, '');
      if (found.length < keys.length) {
        const missing = keys.filter(k => !found.includes(k));
        log(`⚠️ 未検出: ${missing.join(', ')} （このバージョンでは不使用の可能性あり）`, 'warn');
      }
      document.getElementById('mergeBtn').disabled = false;
      document.getElementById('dropZone').classList.add('ready');
      document.getElementById('dropZone').textContent = '📄 ' + file.name;
    }
  };
  reader.readAsText(file);
}

function doMerge() {
  if (!bodyText) return;
  clearLog();
  let result = bodyText;
  let replaced = 0;
  const keys = Object.keys(AUDIO_STORE);
  keys.forEach(k => {
    const placeholder = `/* @@AUDIO_PLACEHOLDER:${k}@@ */`;
    if (result.includes(placeholder)) {
      result = result.replace(placeholder, AUDIO_STORE[k] + '\n');
      replaced++;
      log(`✅ ${k} を埋め込みました`, 'ok');
    }
  });
  if (replaced === 0) {
    log('❌ プレースホルダーが見つかりませんでした', 'err'); return;
  }
  // バージョン検出
  const verMatch = result.match(/>([A-Z]\d+[A-Z])</);
  const ver = verMatch ? verMatch[1] : 'merged';
  const filename = `index${ver}.html`;
  const blob = new Blob([result], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  log(`⬇️ <strong>${filename}</strong> をダウンロードしました（${Math.round(result.length/1024)}KB）`, 'ok');
}

// 初期化
window.addEventListener('DOMContentLoaded', () => {
  if (Object.keys(AUDIO_STORE).length > 0) initInfo();
  else document.getElementById('dataInfo').innerHTML = '<div class="err">⚠️ 音声データが格納されていません</div>';
});
</script>
